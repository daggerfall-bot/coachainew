# CoachAI — Automated installer build.
#
# What this does, with zero toolchain on your own machine:
#   - On every version tag (e.g. v1.0.0) it spins up a Windows, a macOS, and a
#     Linux runner on GitHub's infrastructure.
#   - Each runner compiles the bundled Python backend with PyInstaller, then
#     packages the Electron app into that OS's installer:
#         Windows → CoachAI-Setup-<v>.exe
#         macOS   → CoachAI-<v>.dmg
#         Linux   → CoachAI-<v>.AppImage
#   - All three installers are attached to a GitHub Release.
#
# Trigger it by pushing a tag:
#     git tag v1.0.0 && git push origin v1.0.0
# Or run it manually from the Actions tab.

name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: "app-desktop/dist/*.exe"
          - os: macos-latest
            artifact_glob: "app-desktop/dist/*.dmg"
          - os: ubuntu-latest
            artifact_glob: "app-desktop/dist/*.AppImage"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements-bundled.txt

      - name: Install app dependencies
        working-directory: app-desktop
        run: npm install

      - name: Configure bundled server (.env.local)
        shell: bash
        run: |
          cat > backend/.env.local <<EOF
          COACHAI_LOCAL_MODE=1
          VISION_BACKEND=api
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CALLBACK_URL=${{ secrets.DISCORD_CALLBACK_URL }}
          EOF

      # Build only. Do NOT let electron-builder publish here.
      # The separate release job below publishes the final installers.
      - name: Build installer
        working-directory: app-desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
