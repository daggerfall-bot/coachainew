# CoachAI — Automated installer build.
#
# What this does, with zero toolchain on your own machine:
#   - On every version tag (e.g. v1.0.0) it spins up a Windows, a macOS, and a
#     Linux runner on GitHub's infrastructure (free for public repos / generous
#     free minutes for private).
#   - Each runner compiles the bundled Python backend with PyInstaller, then
#     packages the Electron app into that OS's installer:
#         Windows → CoachAI-Setup-<v>.exe
#         macOS   → CoachAI-<v>.dmg
#         Linux   → CoachAI-<v>.AppImage
#   - All three installers are attached to a GitHub Release. Your website's
#     Download button links straight to those files (see DOWNLOAD_SETUP.md).
#
# Trigger it by pushing a tag:
#     git tag v1.0.0 && git push origin v1.0.0
# Or run it manually from the Actions tab (workflow_dispatch).

name: Build Installers

on:
  push:
    tags:
      - "v*" # any version tag, e.g. v1.0.0, v1.2.3-beta
  workflow_dispatch: # lets you trigger a build by hand from the Actions tab

# The release job needs permission to create a release + upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing shouldn't kill the others
      matrix:
        include:
          - os: windows-latest
            artifact_glob: "app-desktop/dist/*.exe"
          - os: macos-latest
            artifact_glob: "app-desktop/dist/*.dmg"
          - os: ubuntu-latest
            artifact_glob: "app-desktop/dist/*.AppImage"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The bundled server is compiled by PyInstaller. Install backend deps +
      # pyinstaller so build-server.js can run during `npm run build`.
      - name: Install backend build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # SLIM bundle deps: API vision mode needs no torch, the local runner
          # needs no celery/redis, local storage needs no boto3, and there's no
          # Stripe. This keeps the installer small and the build fast. Switch to
          # backend/requirements.txt (full set) once you ship the GPU model.
          pip install -r backend/requirements-bundled.txt

      - name: Install app dependencies
        working-directory: app-desktop
        # `npm install` (not `npm ci`) so the build works even before a
        # package-lock.json is committed. Once you commit a lockfile, you can
        # switch this to `npm ci` for reproducible builds.
        run: npm install

      # Day-one functional build: the bundled server uses the cloud vision API
      # (VISION_BACKEND=api) so the installer works WITHOUT a trained local
      # model. Flip this to self_hosted once ow2_state_detector.pt exists and is
      # committed / downloaded in a step above.
      - name: Configure bundled server (.env.local)
        shell: bash
        run: |
          cat > backend/.env.local <<EOF
          COACHAI_LOCAL_MODE=1
          VISION_BACKEND=api
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CALLBACK_URL=${{ secrets.DISCORD_CALLBACK_URL }}
          EOF

      # Build the installer for this OS. electron-builder reads the matrix OS
      # automatically; build-server.js runs first via the npm "build" script.
      - name: Build installer
        working-directory: app-desktop
        shell: bash
        env:
          # Code-signing secrets (optional but recommended for public release).
          # Leave unset and the build still produces an UNSIGNED installer that
          # works but shows an OS warning on first run. See DOWNLOAD_SETUP.md.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder publishes nothing itself; the release job does it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  # After all three OS builds finish, gather the installers and publish ONE
  # release containing all of them. Your download links point here.
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # only real version tags publish
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attaches every installer from every OS to the release for this tag.
          files: installers/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.0.0-beta → prerelease
